        <script type="text/javascript">
      
          console.log("INLINE SCRIPT STARTED");
          console.log("widget =", typeof widget);
          console.log("executeWidgetCode =", typeof executeWidgetCode);
      
          function widgetLoading() {
      
              console.log(
                  "widgetLoading:",
                  typeof widget,
                  typeof executeWidgetCode
              );
      
              if (
                  typeof widget !== "undefined" &&
                  typeof executeWidgetCode === "function"
              ) {
      
                  console.log("Calling executeWidgetCode");
      
                  executeWidgetCode();
      
              } else {
      
                  setTimeout(widgetLoading, 1000);
      
              }
          }
      
          widgetLoading();
      
      </script>
