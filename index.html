<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:widget="http://www.netvibes.com/ns/">

<head>

    <title>Expense Document Generator</title>

    <meta name="author" content="Doğuşcan Bıyıklı" />
    <meta name="description"
          content="Expense Document Generator for 3DEXPERIENCE" />

    <meta name="apiVersion" content="1.3" />
    <meta name="debugMode" content="true" />
    <meta name="strictMode" content="false" />

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .expense-app {
            padding: 20px;
        }

        .expense-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .expense-header h2 {
            margin: 0 0 6px 0;
        }

        .expense-header p {
            margin: 0;
            color: #666;
        }

        button {
            cursor: pointer;
        }

        .add-expense-button {
            padding: 10px 18px;
        }

        .review-layout {
            display: none;
            gap: 20px;
            margin-top: 20px;
        }

        .preview-panel,
        .form-panel {
            width: 50%;
            box-sizing: border-box;
        }

        .preview-panel {
            border: 1px solid #ddd;
            min-height: 420px;
            padding: 12px;
        }

        .preview-panel img,
        .preview-panel iframe {
            width: 100%;
            height: 400px;
            border: none;
            object-fit: contain;
        }

        .form-panel {
            border: 1px solid #ddd;
            padding: 16px;
        }

        .form-title {
            margin: 0 0 18px 0;
        }

        .receipt-number-box {
            margin-bottom: 16px;
            padding: 10px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .currency-display {
            padding: 8px;
            background: #f5f5f5;
            border: 1px solid #ddd;
        }

        .action-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            padding: 9px 16px;
        }

        .file-name {
            font-size: 13px;
            margin-bottom: 10px;
            color: #555;
        }

        .expense-list-section {
            margin-top: 26px;
        }

        .expense-list-section h3 {
            margin: 0 0 10px 0;
        }

        .expense-table-wrapper {
            overflow-x: auto;
        }

        .expense-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        .expense-table th,
        .expense-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            font-size: 13px;
        }

        .expense-table th {
            background-color: #f5f5f5;
        }

        .receipt-reference {
            font-weight: bold;
            white-space: nowrap;
        }

        .empty-message {
            color: #777;
            font-style: italic;
            padding: 10px 0;
        }

        .table-actions {
            white-space: nowrap;
        }

        .table-actions button {
            margin-right: 5px;
            padding: 5px 8px;
            font-size: 12px;
        }

    </style>


    <script type="text/javascript">

        widget.addEvent("onLoad", function () {

            /*
             * =========================================================
             * DATA
             * =========================================================
             */

            var expenses = [];

            var selectedFile = null;

            var selectedFileUrl = null;

            var currentEditIndex = -1;

            /*
             * Receipt numbers are permanent.
             *
             * [1], [2], [3]...
             *
             * Deleted numbers are NOT reused.
             */

            var nextReceiptNumber = 1;


            /*
             * =========================================================
             * EXCEL MAPPING
             * =========================================================
             */

            var monthSheets = [
                "JAN-01",
                "FEB-02",
                "MAR-03",
                "APR-04",
                "MAY-05",
                "JUN-06",
                "JUL-07",
                "AUG-08",
                "SEP-09",
                "OCT-10",
                "NOV-11",
                "DEC-12"
            ];


            var excelColumnMap = {

                "Fuel": "E",

                "Toll": "F",

                "Parking": "G",

                "Hotel": "H",

                "Meals": "I",

                "Repr. Expenses": "J",

                "Transports": "K",

                "Others": "L"

            };


            /*
             * =========================================================
             * UI
             * =========================================================
             */

            widget.body.innerHTML =

                '<div class="expense-app">' +

                    '<div class="expense-header">' +

                        '<div>' +

                            '<h2>Expense Document Generator</h2>' +

                            '<p>' +
                                'Add and review expense documents before generating the report.' +
                            '</p>' +

                        '</div>' +

                        '<button id="addExpenseBtn" class="add-expense-button">' +
                            'Add Expense' +
                        '</button>' +

                    '</div>' +


                    /*
                     * FILE INPUT
                     */

                    '<input ' +
                        'type="file" ' +
                        'id="expenseFileInput" ' +
                        'accept=".pdf,.jpg,.jpeg,.png" ' +
                        'style="display:none;" ' +
                    '/>' +


                    /*
                     * REVIEW / EDIT AREA
                     */

                    '<div id="reviewLayout" class="review-layout">' +


                        /*
                         * LEFT SIDE
                         */

                        '<div class="preview-panel">' +

                            '<div id="previewFileName" class="file-name"></div>' +

                            '<div id="previewContainer"></div>' +

                        '</div>' +


                        /*
                         * RIGHT SIDE
                         */

                        '<div class="form-panel">' +

                            '<h3 id="formTitle" class="form-title">' +
                                'New Expense' +
                            '</h3>' +


                            '<div id="receiptNumberBox" class="receipt-number-box">' +
                            '</div>' +


                            '<div class="form-group">' +

                                '<label>Date</label>' +

                                '<input ' +
                                    'type="date" ' +
                                    'id="expenseDate" ' +
                                '/>' +

                            '</div>' +


                            '<div class="form-group">' +

                                '<label>Customer / Activity</label>' +

                                '<input ' +
                                    'type="text" ' +
                                    'id="customerActivity" ' +
                                '/>' +

                            '</div>' +


                            '<div class="form-group">' +

                                '<label>Place</label>' +

                                '<input ' +
                                    'type="text" ' +
                                    'id="place" ' +
                                '/>' +

                            '</div>' +


                            '<div class="form-group">' +

                                '<label>Expense Type</label>' +

                                '<select id="expenseType">' +

                                    '<option value="">' +
                                        'Select expense type' +
                                    '</option>' +

                                    '<option value="Fuel">' +
                                        'Fuel' +
                                    '</option>' +

                                    '<option value="Toll">' +
                                        'Toll' +
                                    '</option>' +

                                    '<option value="Parking">' +
                                        'Parking' +
                                    '</option>' +

                                    '<option value="Hotel">' +
                                        'Hotel' +
                                    '</option>' +

                                    '<option value="Meals">' +
                                        'Meals' +
                                    '</option>' +

                                    '<option value="Repr. Expenses">' +
                                        'Repr. Expenses' +
                                    '</option>' +

                                    '<option value="Transports">' +
                                        'Transports' +
                                    '</option>' +

                                    '<option value="Others">' +
                                        'Others' +
                                    '</option>' +

                                '</select>' +

                            '</div>' +


                            '<div class="form-group">' +

                                '<label>Amount (TL)</label>' +

                                '<input ' +
                                    'type="number" ' +
                                    'step="0.01" ' +
                                    'min="0" ' +
                                    'id="amount" ' +
                                '/>' +

                            '</div>' +


                            '<div class="form-group">' +

                                '<label>Currency</label>' +

                                '<div class="currency-display">' +
                                    'TL' +
                                '</div>' +

                            '</div>' +


                            '<div class="action-buttons">' +

                                '<button id="saveExpenseBtn">' +
                                    'Save Expense' +
                                '</button>' +

                                '<button id="closeExpenseBtn">' +
                                    'Cancel' +
                                '</button>' +

                            '</div>' +

                        '</div>' +

                    '</div>' +


                    /*
                     * RECEIPT REGISTER
                     */

                    '<div class="expense-list-section">' +

                        '<h3>Receipt Register</h3>' +

                        '<div id="expenseListContainer"></div>' +

                    '</div>' +

                '</div>';


            /*
             * =========================================================
             * HELPERS
             * =========================================================
             */

            function escapeHtml(value) {

                if (
                    value === null ||
                    value === undefined
                ) {

                    return "";

                }


                return String(value)

                    .replace(/&/g, "&amp;")

                    .replace(/</g, "&lt;")

                    .replace(/>/g, "&gt;")

                    .replace(/"/g, "&quot;")

                    .replace(/'/g, "&#039;");

            }


            function getReceiptReference(receiptNumber) {

                return "[" + receiptNumber + "]";

            }


            function getExcelReceiptReference(receiptNumber) {

                /*
                 * Final Excel notation:
                 *
                 * X[1]
                 * X[2]
                 * X[13]
                 */

                return "X[" + receiptNumber + "]";

            }


            function createExcelTarget(
                date,
                expenseType
            ) {

                var parsedDate =
                    new Date(
                        date + "T00:00:00"
                    );


                var monthIndex =
                    parsedDate.getMonth();


                var day =
                    parsedDate.getDate();


                return {

                    sheet:
                        monthSheets[
                            monthIndex
                        ],

                    day:
                        day,

                    categoryColumn:
                        excelColumnMap[
                            expenseType
                        ]

                };

            }


            /*
             * =========================================================
             * DOCUMENT PREVIEW
             * =========================================================
             */

            function showDocumentPreview(file) {

                if (selectedFileUrl) {

                    URL.revokeObjectURL(
                        selectedFileUrl
                    );

                    selectedFileUrl = null;

                }


                selectedFile =
                    file;


                if (!selectedFile) {

                    return;

                }


                selectedFileUrl =
                    URL.createObjectURL(
                        selectedFile
                    );


                document
                    .getElementById(
                        "previewFileName"
                    )
                    .textContent =
                        selectedFile.name;


                var previewContainer =
                    document.getElementById(
                        "previewContainer"
                    );


                previewContainer.innerHTML =
                    "";


                if (
                    selectedFile.type ===
                    "application/pdf"
                ) {

                    previewContainer.innerHTML =

                        '<iframe src="' +
                            selectedFileUrl +
                        '">' +
                        '</iframe>';

                } else {

                    previewContainer.innerHTML =

                        '<img src="' +
                            selectedFileUrl +
                        '" />';

                }

            }


            /*
             * =========================================================
             * FORM MODE
             * =========================================================
             */

            function setFormReadOnly(readOnly) {

                document
                    .getElementById(
                        "expenseDate"
                    )
                    .disabled =
                        readOnly;


                document
                    .getElementById(
                        "customerActivity"
                    )
                    .disabled =
                        readOnly;


                document
                    .getElementById(
                        "place"
                    )
                    .disabled =
                        readOnly;


                document
                    .getElementById(
                        "expenseType"
                    )
                    .disabled =
                        readOnly;


                document
                    .getElementById(
                        "amount"
                    )
                    .disabled =
                        readOnly;


                document
                    .getElementById(
                        "saveExpenseBtn"
                    )
                    .style.display =

                        readOnly
                            ? "none"
                            : "inline-block";


                document
                    .getElementById(
                        "closeExpenseBtn"
                    )
                    .textContent =

                        readOnly
                            ? "Close"
                            : "Cancel";

            }


            /*
             * =========================================================
             * RESET FORM
             * =========================================================
             */

            function resetExpenseForm() {

                document
                    .getElementById(
                        "expenseDate"
                    )
                    .value = "";


                document
                    .getElementById(
                        "customerActivity"
                    )
                    .value = "";


                document
                    .getElementById(
                        "place"
                    )
                    .value = "";


                document
                    .getElementById(
                        "expenseType"
                    )
                    .value = "";


                document
                    .getElementById(
                        "amount"
                    )
                    .value = "";


                document
                    .getElementById(
                        "expenseFileInput"
                    )
                    .value = "";


                document
                    .getElementById(
                        "reviewLayout"
                    )
                    .style.display =
                        "none";


                document
                    .getElementById(
                        "previewContainer"
                    )
                    .innerHTML = "";


                document
                    .getElementById(
                        "previewFileName"
                    )
                    .textContent = "";


                document
                    .getElementById(
                        "receiptNumberBox"
                    )
                    .textContent = "";


                if (selectedFileUrl) {

                    URL.revokeObjectURL(
                        selectedFileUrl
                    );

                }


                selectedFileUrl =
                    null;


                selectedFile =
                    null;


                currentEditIndex =
                    -1;


                setFormReadOnly(
                    false
                );

            }


            /*
             * =========================================================
             * RENDER RECEIPT REGISTER
             * =========================================================
             */

            function renderExpenseList() {

                var container =
                    document.getElementById(
                        "expenseListContainer"
                    );


                if (
                    expenses.length === 0
                ) {

                    container.innerHTML =

                        '<div class="empty-message">' +
                            'No receipts added yet.' +
                        '</div>';


                    return;

                }


                var html =

                    '<div class="expense-table-wrapper">' +

                        '<table class="expense-table">' +

                            '<thead>' +

                                '<tr>' +

                                    '<th>Receipt</th>' +

                                    '<th>Date</th>' +

                                    '<th>Customer / Activity</th>' +

                                    '<th>Place</th>' +

                                    '<th>Expense Type</th>' +

                                    '<th>Amount (TL)</th>' +

                                    '<th>Document</th>' +

                                    '<th>Actions</th>' +

                                '</tr>' +

                            '</thead>' +

                            '<tbody>';


                for (
                    var i = 0;
                    i < expenses.length;
                    i++
                ) {

                    var expense =
                        expenses[i];


                    html +=

                        '<tr>' +


                            /*
                             * RECEIPT REFERENCE
                             */

                            '<td class="receipt-reference">' +

                                escapeHtml(

                                    getReceiptReference(
                                        expense.receiptNumber
                                    )

                                ) +

                            '</td>' +


                            /*
                             * DATE
                             */

                            '<td>' +

                                escapeHtml(
                                    expense.date
                                ) +

                            '</td>' +


                            /*
                             * CUSTOMER / ACTIVITY
                             */

                            '<td>' +

                                escapeHtml(
                                    expense.customerActivity
                                ) +

                            '</td>' +


                            /*
                             * PLACE
                             */

                            '<td>' +

                                escapeHtml(
                                    expense.place
                                ) +

                            '</td>' +


                            /*
                             * EXPENSE TYPE
                             */

                            '<td>' +

                                escapeHtml(
                                    expense.expenseType
                                ) +

                            '</td>' +


                            /*
                             * AMOUNT
                             */

                            '<td>' +

                                expense.amount
                                    .toFixed(2) +

                            '</td>' +


                            /*
                             * FILE
                             */

                            '<td>' +

                                escapeHtml(
                                    expense.fileName
                                ) +

                            '</td>' +


                            /*
                             * ACTIONS
                             */

                            '<td class="table-actions">' +

                                '<button ' +
                                    'data-action="view" ' +
                                    'data-index="' +
                                    i +
                                    '">' +
                                    'View' +
                                '</button>' +

                                '<button ' +
                                    'data-action="edit" ' +
                                    'data-index="' +
                                    i +
                                    '">' +
                                    'Edit' +
                                '</button>' +

                                '<button ' +
                                    'data-action="delete" ' +
                                    'data-index="' +
                                    i +
                                    '">' +
                                    'Delete' +
                                '</button>' +

                            '</td>' +


                        '</tr>';

                }


                html +=

                            '</tbody>' +

                        '</table>' +

                    '</div>';


                container.innerHTML =
                    html;

            }


            /*
             * =========================================================
             * OPEN EXISTING RECEIPT
             * =========================================================
             */

            function openExpense(
                index,
                mode
            ) {

                var expense =
                    expenses[index];


                if (!expense) {

                    return;

                }


                currentEditIndex =
                    index;


                document
                    .getElementById(
                        "expenseDate"
                    )
                    .value =
                        expense.date;


                document
                    .getElementById(
                        "customerActivity"
                    )
                    .value =
                        expense.customerActivity;


                document
                    .getElementById(
                        "place"
                    )
                    .value =
                        expense.place;


                document
                    .getElementById(
                        "expenseType"
                    )
                    .value =
                        expense.expenseType;


                document
                    .getElementById(
                        "amount"
                    )
                    .value =
                        expense.amount;


                /*
                 * Permanent receipt reference
                 */

                document
                    .getElementById(
                        "receiptNumberBox"
                    )
                    .textContent =

                        "Receipt " +

                        getReceiptReference(
                            expense.receiptNumber
                        );


                showDocumentPreview(
                    expense.file
                );


                document
                    .getElementById(
                        "reviewLayout"
                    )
                    .style.display =
                        "flex";


                if (
                    mode === "view"
                ) {

                    document
                        .getElementById(
                            "formTitle"
                        )
                        .textContent =
                            "View Expense";


                    setFormReadOnly(
                        true
                    );

                } else {

                    document
                        .getElementById(
                            "formTitle"
                        )
                        .textContent =
                            "Edit Expense";


                    setFormReadOnly(
                        false
                    );

                }

            }


            /*
             * =========================================================
             * ADD NEW RECEIPT
             * =========================================================
             */

            document
                .getElementById(
                    "addExpenseBtn"
                )
                .addEventListener(
                    "click",
                    function () {

                        resetExpenseForm();


                        document
                            .getElementById(
                                "expenseFileInput"
                            )
                            .click();

                    }
                );


            /*
             * =========================================================
             * FILE SELECTED
             * =========================================================
             */

            document
                .getElementById(
                    "expenseFileInput"
                )
                .addEventListener(
                    "change",
                    function (event) {

                        var file =
                            event.target.files[0];


                        if (!file) {

                            return;

                        }


                        var allowedTypes = [

                            "application/pdf",

                            "image/jpeg",

                            "image/png"

                        ];


                        if (

                            allowedTypes.indexOf(
                                file.type
                            ) === -1

                        ) {

                            alert(

                                "Unsupported file type.\n\n" +

                                "Please select a PDF, JPG or PNG document."

                            );


                            event.target.value =
                                "";


                            return;

                        }


                        currentEditIndex =
                            -1;


                        document
                            .getElementById(
                                "formTitle"
                            )
                            .textContent =
                                "New Expense";


                        /*
                         * Show number that will be assigned
                         */

                        document
                            .getElementById(
                                "receiptNumberBox"
                            )
                            .textContent =

                                "Receipt " +

                                getReceiptReference(
                                    nextReceiptNumber
                                );


                        setFormReadOnly(
                            false
                        );


                        showDocumentPreview(
                            file
                        );


                        document
                            .getElementById(
                                "reviewLayout"
                            )
                            .style.display =
                                "flex";

                    }
                );


            /*
             * =========================================================
             * SAVE / UPDATE
             * =========================================================
             */

            document
                .getElementById(
                    "saveExpenseBtn"
                )
                .addEventListener(
                    "click",
                    function () {


                        if (!selectedFile) {

                            alert(
                                "Please select a receipt document."
                            );

                            return;

                        }


                        var date =

                            document
                                .getElementById(
                                    "expenseDate"
                                )
                                .value;


                        var customerActivity =

                            document
                                .getElementById(
                                    "customerActivity"
                                )
                                .value
                                .trim();


                        var place =

                            document
                                .getElementById(
                                    "place"
                                )
                                .value
                                .trim();


                        var expenseType =

                            document
                                .getElementById(
                                    "expenseType"
                                )
                                .value;


                        var amountValue =

                            document
                                .getElementById(
                                    "amount"
                                )
                                .value;


                        /*
                         * VALIDATION
                         */

                        if (!date) {

                            alert(
                                "Please enter the expense date."
                            );

                            return;

                        }


                        if (!customerActivity) {

                            alert(
                                "Please enter Customer / Activity."
                            );

                            return;

                        }


                        if (!place) {

                            alert(
                                "Please enter Place."
                            );

                            return;

                        }


                        if (!expenseType) {

                            alert(
                                "Please select an Expense Type."
                            );

                            return;

                        }


                        if (

                            !amountValue ||

                            parseFloat(
                                amountValue
                            ) <= 0

                        ) {

                            alert(
                                "Please enter a valid Amount."
                            );

                            return;

                        }


                        var amount =
                            parseFloat(
                                amountValue
                            );


                        /*
                         * =================================================
                         * UPDATE EXISTING
                         * =================================================
                         */

                        if (
                            currentEditIndex >= 0
                        ) {

                            var existingExpense =
                                expenses[
                                    currentEditIndex
                                ];


                            /*
                             * receiptNumber is intentionally NOT changed.
                             */

                            existingExpense.date =
                                date;


                            existingExpense.customerActivity =
                                customerActivity;


                            existingExpense.place =
                                place;


                            existingExpense.expenseType =
                                expenseType;


                            existingExpense.amount =
                                amount;


                            existingExpense.currency =
                                "TRY";


                            existingExpense.excelTarget =

                                createExcelTarget(
                                    date,
                                    expenseType
                                );


                            console.log(

                                "Receipt updated:",

                                getReceiptReference(
                                    existingExpense.receiptNumber
                                ),

                                existingExpense

                            );

                        }


                        /*
                         * =================================================
                         * CREATE NEW
                         * =================================================
                         */

                        else {

                            var receiptNumber =
                                nextReceiptNumber;


                            var expense = {


                                /*
                                 * MASTER TRACEABILITY ID
                                 */

                                receiptNumber:
                                    receiptNumber,


                                /*
                                 * EXPENSE DATA
                                 */

                                date:
                                    date,


                                customerActivity:
                                    customerActivity,


                                place:
                                    place,


                                expenseType:
                                    expenseType,


                                amount:
                                    amount,


                                /*
                                 * COMPANY EXPENSES ARE TL ONLY
                                 */

                                currency:
                                    "TRY",


                                /*
                                 * SOURCE DOCUMENT
                                 */

                                fileName:
                                    selectedFile.name,


                                fileType:
                                    selectedFile.type,


                                fileSize:
                                    selectedFile.size,


                                file:
                                    selectedFile,


                                /*
                                 * EXCEL TRACEABILITY
                                 */

                                excelReference:

                                    getExcelReceiptReference(
                                        receiptNumber
                                    ),


                                /*
                                 * EXCEL DESTINATION
                                 */

                                excelTarget:

                                    createExcelTarget(
                                        date,
                                        expenseType
                                    )

                            };


                            expenses.push(
                                expense
                            );


                            /*
                             * Never reuse receipt numbers.
                             */

                            nextReceiptNumber++;


                            console.log(

                                "Receipt created:",

                                getReceiptReference(
                                    expense.receiptNumber
                                ),

                                expense

                            );

                        }


                        console.log(

                            "Receipt Register:",

                            expenses

                        );


                        renderExpenseList();


                        resetExpenseForm();

                    }
                );


            /*
             * =========================================================
             * CLOSE / CANCEL
             * =========================================================
             */

            document
                .getElementById(
                    "closeExpenseBtn"
                )
                .addEventListener(
                    "click",
                    function () {

                        resetExpenseForm();

                    }
                );


            /*
             * =========================================================
             * VIEW / EDIT / DELETE
             * =========================================================
             */

            document
                .getElementById(
                    "expenseListContainer"
                )
                .addEventListener(
                    "click",
                    function (event) {

                        var button =

                            event.target.closest(
                                "button[data-action]"
                            );


                        if (!button) {

                            return;

                        }


                        var action =

                            button.getAttribute(
                                "data-action"
                            );


                        var index =

                            parseInt(

                                button.getAttribute(
                                    "data-index"
                                ),

                                10

                            );


                        /*
                         * VIEW
                         */

                        if (
                            action === "view"
                        ) {

                            openExpense(
                                index,
                                "view"
                            );

                            return;

                        }


                        /*
                         * EDIT
                         */

                        if (
                            action === "edit"
                        ) {

                            openExpense(
                                index,
                                "edit"
                            );

                            return;

                        }


                        /*
                         * DELETE
                         */

                        if (
                            action === "delete"
                        ) {

                            var expense =
                                expenses[index];


                            if (!expense) {

                                return;

                            }


                            var confirmed =

                                confirm(

                                    "Delete Receipt " +

                                    getReceiptReference(
                                        expense.receiptNumber
                                    ) +

                                    "?\n\n" +

                                    expense.date +

                                    " - " +

                                    expense.customerActivity +

                                    "\n" +

                                    expense.amount.toFixed(2) +

                                    " TL"

                                );


                            if (!confirmed) {

                                return;

                            }


                            /*
                             * Important:
                             *
                             * We remove the expense,
                             * but NEVER renumber other receipts.
                             */

                            expenses.splice(
                                index,
                                1
                            );


                            console.log(

                                "Receipt deleted:",

                                getReceiptReference(
                                    expense.receiptNumber
                                )

                            );


                            renderExpenseList();


                            resetExpenseForm();

                        }

                    }
                );


            /*
             * =========================================================
             * INITIAL RENDER
             * =========================================================
             */

            renderExpenseList();

        });

    </script>
