<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:widget="http://www.netvibes.com/ns/">

<head>

    <title>Expense Document Generator</title>

    <meta name="author" content="Doğuşcan Bıyıklı" />
    <meta name="description"
          content="Expense Document Generator for 3DEXPERIENCE" />

    <meta name="apiVersion" content="1.3" />
    <meta name="debugMode" content="true" />
    <meta name="strictMode" content="false" />

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .expense-app {
            padding: 24px;
        }

        .expense-app h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
        }

        .subtitle {
            margin: 0 0 20px 0;
            color: #666666;
        }

        .add-expense-button {
            padding: 10px 18px;
            cursor: pointer;
            font-size: 14px;
        }

        .file-info {
            margin-top: 20px;
            padding: 14px;
            border: 1px solid #dddddd;
            border-radius: 4px;
            display: none;
        }

        .file-name {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .file-detail {
            color: #666666;
            font-size: 13px;
            margin-top: 4px;
        }

    </style>


    <script type="text/javascript">

        widget.addEvent("onLoad", function () {

            console.log("Expense Document Generator started.");

            widget.body.innerHTML =
                '<div class="expense-app">' +

                    '<h2>Expense Document Generator</h2>' +

                    '<p class="subtitle">' +
                        'Manage your expense documents.' +
                    '</p>' +

                    '<input ' +
                        'type="file" ' +
                        'id="expenseFileInput" ' +
                        'accept=".pdf,.jpg,.jpeg,.png" ' +
                        'style="display:none;" ' +
                    '/>' +

                    '<button ' +
                        'id="addExpenseBtn" ' +
                        'class="add-expense-button">' +
                        'Add Expense' +
                    '</button>' +

                    '<div id="selectedFileInfo" class="file-info">' +

                        '<div id="selectedFileName" class="file-name"></div>' +

                        '<div id="selectedFileType" class="file-detail"></div>' +

                        '<div id="selectedFileSize" class="file-detail"></div>' +

                    '</div>' +

                '</div>';


            /*
             * ADD EXPENSE BUTTON
             */

            document
                .getElementById("addExpenseBtn")
                .addEventListener("click", function () {

                    document
                        .getElementById("expenseFileInput")
                        .click();

                });


            /*
             * FILE SELECTION
             */

            document
                .getElementById("expenseFileInput")
                .addEventListener("change", function (event) {

                    var file = event.target.files[0];

                    if (!file) {
                        return;
                    }


                    /*
                     * ALLOWED FILE TYPES
                     */

                    var allowedTypes = [
                        "application/pdf",
                        "image/jpeg",
                        "image/png"
                    ];


                    /*
                     * VALIDATION
                     */

                    if (allowedTypes.indexOf(file.type) === -1) {

                        alert(
                            "Unsupported file type.\n\n" +
                            "Please select a PDF, JPG or PNG document."
                        );

                        event.target.value = "";

                        return;
                    }


                    /*
                     * FILE INFORMATION
                     */

                    var fileSizeKB =
                        Math.round(file.size / 1024);


                    document
                        .getElementById("selectedFileName")
                        .innerHTML =
                            "Selected document: " + file.name;


                    document
                        .getElementById("selectedFileType")
                        .innerHTML =
                            "Type: " + file.type;


                    document
                        .getElementById("selectedFileSize")
                        .innerHTML =
                            "Size: " + fileSizeKB + " KB";


                    document
                        .getElementById("selectedFileInfo")
                        .style.display = "block";


                    console.log(
                        "Expense document selected:",
                        file
                    );

                });

        });

    </script>

</head>


<body>
</body>

</html>
