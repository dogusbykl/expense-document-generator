<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:widget="http://www.netvibes.com/ns/">

<head>

    <title>Expense Document Generator</title>

    <meta name="author" content="Doğuşcan Bıyıklı" />
    <meta name="description"
          content="Expense Document Generator for 3DEXPERIENCE" />

    <meta name="apiVersion" content="1.3" />
    <meta name="debugMode" content="true" />
    <meta name="strictMode" content="false" />

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .expense-app {
            padding: 20px;
        }

        .expense-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .expense-header h2 {
            margin: 0 0 6px 0;
        }

        .expense-header p {
            margin: 0;
            color: #666;
        }

        .add-expense-button {
            padding: 10px 18px;
            cursor: pointer;
        }

        .review-layout {
            display: none;
            gap: 20px;
            margin-top: 20px;
        }

        .preview-panel,
        .form-panel {
            width: 50%;
            box-sizing: border-box;
        }

        .preview-panel {
            border: 1px solid #ddd;
            min-height: 420px;
            padding: 12px;
        }

        .preview-panel img,
        .preview-panel iframe {
            width: 100%;
            height: 400px;
            border: none;
            object-fit: contain;
        }

        .form-panel {
            border: 1px solid #ddd;
            padding: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .action-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            padding: 9px 16px;
            cursor: pointer;
        }

        .file-name {
            font-size: 13px;
            margin-bottom: 10px;
            color: #555;
        }

        .expense-list-section {
            margin-top: 26px;
        }

        .expense-list-section h3 {
            margin: 0 0 10px 0;
        }

        .expense-table-wrapper {
            overflow-x: auto;
        }

        .expense-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        .expense-table th,
        .expense-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            font-size: 13px;
        }

        .expense-table th {
            background-color: #f5f5f5;
        }

        .empty-message {
            color: #777;
            font-style: italic;
            padding: 10px 0;
        }

        .expense-id {
            color: #666;
            font-size: 12px;
        }

    </style>


    <script type="text/javascript">

        widget.addEvent("onLoad", function () {

            /*
             * IN-MEMORY DATA
             */

            var expenses = [];

            var selectedFile = null;

            var selectedFileUrl = null;


            /*
             * EXCEL TEMPLATE MAPPING
             */

            var monthSheets = [
                "JAN-01",
                "FEB-02",
                "MAR-03",
                "APR-04",
                "MAY-05",
                "JUN-06",
                "JUL-07",
                "AUG-08",
                "SEP-09",
                "OCT-10",
                "NOV-11",
                "DEC-12"
            ];


            var excelColumnMap = {
                "Fuel": "E",
                "Toll": "F",
                "Parking": "G",
                "Hotel": "H",
                "Meals": "I",
                "Repr. Expenses": "J",
                "Transports": "K",
                "Others": "L"
            };


            /*
             * MAIN UI
             */

            widget.body.innerHTML =
                '<div class="expense-app">' +

                    '<div class="expense-header">' +

                        '<div>' +
                            '<h2>Expense Document Generator</h2>' +
                            '<p>Add and review expense documents before generating the report.</p>' +
                        '</div>' +

                        '<button id="addExpenseBtn" class="add-expense-button">' +
                            'Add Expense' +
                        '</button>' +

                    '</div>' +


                    '<input ' +
                        'type="file" ' +
                        'id="expenseFileInput" ' +
                        'accept=".pdf,.jpg,.jpeg,.png" ' +
                        'style="display:none;" ' +
                    '/>' +


                    /*
                     * REVIEW AREA
                     */

                    '<div id="reviewLayout" class="review-layout">' +

                        /*
                         * DOCUMENT PREVIEW
                         */

                        '<div class="preview-panel">' +

                            '<div id="previewFileName" class="file-name"></div>' +

                            '<div id="previewContainer"></div>' +

                        '</div>' +


                        /*
                         * EXPENSE DATA
                         */

                        '<div class="form-panel">' +

                            '<div class="form-group">' +
                                '<label>Date</label>' +
                                '<input type="date" id="expenseDate" />' +
                            '</div>' +


                            '<div class="form-group">' +
                                '<label>Customer / Activity</label>' +
                                '<input type="text" id="customerActivity" />' +
                            '</div>' +


                            '<div class="form-group">' +
                                '<label>Place</label>' +
                                '<input type="text" id="place" />' +
                            '</div>' +


                            '<div class="form-group">' +

                                '<label>Expense Type</label>' +

                                '<select id="expenseType">' +

                                    '<option value="">Select expense type</option>' +

                                    '<option value="Fuel">Fuel</option>' +

                                    '<option value="Toll">Toll</option>' +

                                    '<option value="Parking">Parking</option>' +

                                    '<option value="Hotel">Hotel</option>' +

                                    '<option value="Meals">Meals</option>' +

                                    '<option value="Repr. Expenses">' +
                                        'Repr. Expenses' +
                                    '</option>' +

                                    '<option value="Transports">' +
                                        'Transports' +
                                    '</option>' +

                                    '<option value="Others">Others</option>' +

                                '</select>' +

                            '</div>' +


                            '<div class="form-group">' +
                                '<label>Amount</label>' +
                                '<input type="number" step="0.01" min="0" id="amount" />' +
                            '</div>' +


                            '<div class="form-group">' +

                                '<label>Currency</label>' +

                                '<select id="currency">' +
                                    '<option value="EUR">EUR</option>' +
                                    '<option value="TRY">TRY</option>' +
                                    '<option value="USD">USD</option>' +
                                '</select>' +

                            '</div>' +


                            '<div class="action-buttons">' +

                                '<button id="saveExpenseBtn">' +
                                    'Save Expense' +
                                '</button>' +

                                '<button id="cancelExpenseBtn">' +
                                    'Cancel' +
                                '</button>' +

                            '</div>' +

                        '</div>' +

                    '</div>' +


                    /*
                     * EXPENSE LIST
                     */

                    '<div class="expense-list-section">' +

                        '<h3>Expense Documents</h3>' +

                        '<div id="expenseListContainer"></div>' +

                    '</div>' +

                '</div>';


            /*
             * RENDER EXPENSE LIST
             */

            function renderExpenseList() {

                var container =
                    document.getElementById(
                        "expenseListContainer"
                    );


                if (expenses.length === 0) {

                    container.innerHTML =
                        '<div class="empty-message">' +
                            'No expense documents added yet.' +
                        '</div>';

                    return;
                }


                var html =
                    '<div class="expense-table-wrapper">' +

                    '<table class="expense-table">' +

                        '<thead>' +

                            '<tr>' +
                                '<th>#</th>' +
                                '<th>Date</th>' +
                                '<th>Customer / Activity</th>' +
                                '<th>Place</th>' +
                                '<th>Expense Type</th>' +
                                '<th>Amount</th>' +
                                '<th>Currency</th>' +
                                '<th>Receipt</th>' +
                            '</tr>' +

                        '</thead>' +

                        '<tbody>';


                for (
                    var i = 0;
                    i < expenses.length;
                    i++
                ) {

                    var expense = expenses[i];


                    html +=

                        '<tr>' +

                            '<td>' +
                                '<div>' + (i + 1) + '</div>' +
                                '<div class="expense-id">' +
                                    expense.id +
                                '</div>' +
                            '</td>' +

                            '<td>' +
                                expense.date +
                            '</td>' +

                            '<td>' +
                                expense.customerActivity +
                            '</td>' +

                            '<td>' +
                                expense.place +
                            '</td>' +

                            '<td>' +
                                expense.expenseType +
                            '</td>' +

                            '<td>' +
                                expense.amount.toFixed(2) +
                            '</td>' +

                            '<td>' +
                                expense.currency +
                            '</td>' +

                            '<td>' +
                                expense.fileName +
                            '</td>' +

                        '</tr>';
                }


                html +=
                        '</tbody>' +

                    '</table>' +

                    '</div>';


                container.innerHTML = html;
            }


            /*
             * RESET FORM
             */

            function resetExpenseForm() {

                document
                    .getElementById("expenseDate")
                    .value = "";

                document
                    .getElementById("customerActivity")
                    .value = "";

                document
                    .getElementById("place")
                    .value = "";

                document
                    .getElementById("expenseType")
                    .value = "";

                document
                    .getElementById("amount")
                    .value = "";

                document
                    .getElementById("currency")
                    .value = "EUR";

                document
                    .getElementById("expenseFileInput")
                    .value = "";

                document
                    .getElementById("reviewLayout")
                    .style.display = "none";


                if (selectedFileUrl) {

                    URL.revokeObjectURL(
                        selectedFileUrl
                    );
                }


                selectedFile = null;

                selectedFileUrl = null;
            }


            /*
             * ADD EXPENSE
             */

            document
                .getElementById("addExpenseBtn")
                .addEventListener("click", function () {

                    document
                        .getElementById("expenseFileInput")
                        .click();

                });


            /*
             * FILE SELECTED
             */

            document
                .getElementById("expenseFileInput")
                .addEventListener(
                    "change",
                    function (event) {

                        var file =
                            event.target.files[0];


                        if (!file) {
                            return;
                        }


                        var allowedTypes = [
                            "application/pdf",
                            "image/jpeg",
                            "image/png"
                        ];


                        if (
                            allowedTypes.indexOf(
                                file.type
                            ) === -1
                        ) {

                            alert(
                                "Unsupported file type.\n\n" +
                                "Please select a PDF, JPG or PNG document."
                            );

                            event.target.value = "";

                            return;
                        }


                        selectedFile = file;


                        selectedFileUrl =
                            URL.createObjectURL(
                                selectedFile
                            );


                        document
                            .getElementById(
                                "previewFileName"
                            )
                            .textContent =
                                selectedFile.name;


                        var previewContainer =
                            document.getElementById(
                                "previewContainer"
                            );


                        previewContainer.innerHTML = "";


                        if (
                            selectedFile.type ===
                            "application/pdf"
                        ) {

                            previewContainer.innerHTML =
                                '<iframe src="' +
                                selectedFileUrl +
                                '"></iframe>';

                        } else {

                            previewContainer.innerHTML =
                                '<img src="' +
                                selectedFileUrl +
                                '" />';

                        }


                        document
                            .getElementById(
                                "reviewLayout"
                            )
                            .style.display = "flex";

                    }
                );


            /*
             * SAVE EXPENSE
             */

            document
                .getElementById("saveExpenseBtn")
                .addEventListener("click", function () {

                    if (!selectedFile) {

                        alert(
                            "Please select a receipt document."
                        );

                        return;
                    }


                    var date =
                        document
                            .getElementById(
                                "expenseDate"
                            )
                            .value;


                    var customerActivity =
                        document
                            .getElementById(
                                "customerActivity"
                            )
                            .value
                            .trim();


                    var place =
                        document
                            .getElementById(
                                "place"
                            )
                            .value
                            .trim();


                    var expenseType =
                        document
                            .getElementById(
                                "expenseType"
                            )
                            .value;


                    var amountValue =
                        document
                            .getElementById(
                                "amount"
                            )
                            .value;


                    var currency =
                        document
                            .getElementById(
                                "currency"
                            )
                            .value;


                    /*
                     * VALIDATION
                     */

                    if (!date) {

                        alert(
                            "Please enter the expense date."
                        );

                        return;
                    }


                    if (!customerActivity) {

                        alert(
                            "Please enter Customer / Activity."
                        );

                        return;
                    }


                    if (!place) {

                        alert(
                            "Please enter Place."
                        );

                        return;
                    }


                    if (!expenseType) {

                        alert(
                            "Please select an Expense Type."
                        );

                        return;
                    }


                    if (
                        !amountValue ||
                        parseFloat(amountValue) <= 0
                    ) {

                        alert(
                            "Please enter a valid Amount."
                        );

                        return;
                    }


                    /*
                     * DETERMINE EXCEL TARGET
                     */

                    var parsedDate =
                        new Date(
                            date + "T00:00:00"
                        );


                    var monthIndex =
                        parsedDate.getMonth();


                    var day =
                        parsedDate.getDate();


                    var excelSheet =
                        monthSheets[
                            monthIndex
                        ];


                    var excelColumn =
                        excelColumnMap[
                            expenseType
                        ];


                    /*
                     * CREATE EXPENSE OBJECT
                     */

                    var expense = {

                        id:
                            "EXP-" +
                            String(
                                expenses.length + 1
                            ).padStart(4, "0"),

                        date:
                            date,

                        day:
                            day,

                        customerActivity:
                            customerActivity,

                        place:
                            place,

                        expenseType:
                            expenseType,

                        amount:
                            parseFloat(
                                amountValue
                            ),

                        currency:
                            currency,

                        fileName:
                            selectedFile.name,

                        fileType:
                            selectedFile.type,

                        fileSize:
                            selectedFile.size,

                        file:
                            selectedFile,

                        /*
                         * FINAL EXCEL TARGET
                         */

                        excelTarget: {

                            sheet:
                                excelSheet,

                            day:
                                day,

                            categoryColumn:
                                excelColumn

                        }

                    };


                    expenses.push(
                        expense
                    );


                    console.log(
                        "Expense saved:",
                        expense
                    );


                    console.log(
                        "Excel target:",
                        expense.excelTarget
                    );


                    console.log(
                        "All expenses:",
                        expenses
                    );


                    renderExpenseList();


                    resetExpenseForm();

                });


            /*
             * CANCEL
             */

            document
                .getElementById("cancelExpenseBtn")
                .addEventListener("click", function () {

                    resetExpenseForm();

                });


            /*
             * INITIAL LIST
             */

            renderExpenseList();

        });

    </script>

</head>

<body>
</body>

</html>
