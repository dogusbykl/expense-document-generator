<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:widget="http://www.netvibes.com/ns/">

<head>

    <title>Expense Document Generator</title>

    <meta name="author" content="Doğuşcan Bıyıklı" />
    <meta name="description"
          content="Expense Document Generator for 3DEXPERIENCE" />

    <meta name="apiVersion" content="1.3" />
    <meta name="debugMode" content="true" />
    <meta name="strictMode" content="false" />

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .expense-app {
            padding: 20px;
        }

        .expense-header {
            margin-bottom: 20px;
        }

        .expense-header h2 {
            margin: 0 0 6px 0;
        }

        .expense-header p {
            margin: 0;
            color: #666;
        }

        .add-expense-button {
            padding: 10px 18px;
            cursor: pointer;
        }

        .review-layout {
            display: none;
            gap: 20px;
            margin-top: 20px;
        }

        .preview-panel,
        .form-panel {
            width: 50%;
            box-sizing: border-box;
        }

        .preview-panel {
            border: 1px solid #ddd;
            min-height: 420px;
            padding: 12px;
        }

        .preview-panel img,
        .preview-panel iframe {
            width: 100%;
            height: 400px;
            border: none;
            object-fit: contain;
        }

        .form-panel {
            border: 1px solid #ddd;
            padding: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .action-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            padding: 9px 16px;
            cursor: pointer;
        }

        .file-name {
            font-size: 13px;
            margin-bottom: 10px;
            color: #555;
        }

    </style>


    <script type="text/javascript">

        widget.addEvent("onLoad", function () {

            widget.body.innerHTML =
                '<div class="expense-app">' +

                    '<div class="expense-header">' +
                        '<h2>Expense Document Generator</h2>' +
                        '<p>Manage your expense documents.</p>' +
                    '</div>' +

                    '<input ' +
                        'type="file" ' +
                        'id="expenseFileInput" ' +
                        'accept=".pdf,.jpg,.jpeg,.png" ' +
                        'style="display:none;" ' +
                    '/>' +

                    '<button id="addExpenseBtn" class="add-expense-button">' +
                        'Add Expense' +
                    '</button>' +

                    '<div id="reviewLayout" class="review-layout">' +

                        '<div class="preview-panel">' +
                            '<div id="previewFileName" class="file-name"></div>' +
                            '<div id="previewContainer"></div>' +
                        '</div>' +

                        '<div class="form-panel">' +

                            '<div class="form-group">' +
                                '<label>Date</label>' +
                                '<input type="date" id="expenseDate" />' +
                            '</div>' +

                            '<div class="form-group">' +
                                '<label>Merchant</label>' +
                                '<input type="text" id="merchant" />' +
                            '</div>' +

                            '<div class="form-group">' +
                                '<label>Category</label>' +
                                '<select id="category">' +
                                    '<option value="">Select category</option>' +
                                    '<option value="Travel">Travel</option>' +
                                    '<option value="Hotel">Hotel</option>' +
                                    '<option value="Meal">Meal</option>' +
                                    '<option value="Transport">Transport</option>' +
                                    '<option value="Other">Other</option>' +
                                '</select>' +
                            '</div>' +

                            '<div class="form-group">' +
                                '<label>Amount</label>' +
                                '<input type="number" step="0.01" id="amount" />' +
                            '</div>' +

                            '<div class="form-group">' +
                                '<label>Currency</label>' +
                                '<select id="currency">' +
                                    '<option value="EUR">EUR</option>' +
                                    '<option value="USD">USD</option>' +
                                    '<option value="TRY">TRY</option>' +
                                '</select>' +
                            '</div>' +

                            '<div class="form-group">' +
                                '<label>Description</label>' +
                                '<input type="text" id="description" />' +
                            '</div>' +

                            '<div class="action-buttons">' +
                                '<button id="saveExpenseBtn">Save Expense</button>' +
                                '<button id="cancelExpenseBtn">Cancel</button>' +
                            '</div>' +

                        '</div>' +

                    '</div>' +

                '</div>';


            document
                .getElementById("addExpenseBtn")
                .addEventListener("click", function () {

                    document
                        .getElementById("expenseFileInput")
                        .click();

                });


            document
                .getElementById("expenseFileInput")
                .addEventListener("change", function (event) {

                    var file = event.target.files[0];

                    if (!file) {
                        return;
                    }

                    var allowedTypes = [
                        "application/pdf",
                        "image/jpeg",
                        "image/png"
                    ];

                    if (allowedTypes.indexOf(file.type) === -1) {

                        alert(
                            "Unsupported file type.\n\n" +
                            "Please select a PDF, JPG or PNG document."
                        );

                        event.target.value = "";

                        return;
                    }

                    var objectUrl = URL.createObjectURL(file);

                    document
                        .getElementById("previewFileName")
                        .innerHTML = file.name;

                    var previewContainer =
                        document.getElementById("previewContainer");

                    previewContainer.innerHTML = "";

                    if (file.type === "application/pdf") {

                        previewContainer.innerHTML =
                            '<iframe src="' + objectUrl + '"></iframe>';

                    } else {

                        previewContainer.innerHTML =
                            '<img src="' + objectUrl + '" />';

                    }

                    document
                        .getElementById("reviewLayout")
                        .style.display = "flex";

                });


            document
                .getElementById("saveExpenseBtn")
                .addEventListener("click", function () {

                    var expense = {

                        date:
                            document.getElementById("expenseDate").value,

                        merchant:
                            document.getElementById("merchant").value,

                        category:
                            document.getElementById("category").value,

                        amount:
                            document.getElementById("amount").value,

                        currency:
                            document.getElementById("currency").value,

                        description:
                            document.getElementById("description").value

                    };

                    console.log("Expense data:", expense);

                    alert("Expense data captured successfully.");

                });


            document
                .getElementById("cancelExpenseBtn")
                .addEventListener("click", function () {

                    document
                        .getElementById("reviewLayout")
                        .style.display = "none";

                    document
                        .getElementById("expenseFileInput")
                        .value = "";

                });

        });

    </script>

</head>

<body>
</body>

</html>
