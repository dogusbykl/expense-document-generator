<?xml version="1.0" encoding="utf-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:widget="http://www.netvibes.com/ns/">

<head>

    <title>Expense Document Generator</title>

    <meta name="author" content="Expense Document Generator" />
    <meta name="description" content="3DEXPERIENCE Expense Document Generator" />
    <meta name="apiVersion" content="1.3" />
    <meta name="debugMode" content="true" />
    <meta name="strictMode" content="false" />

    <script type="text/javascript"
        src="https://uwa.netvibes.com/lib/c/UWA/js/UWA_Standalone_Alone.js">
    </script>

    <script type="text/javascript">

        function executeWidgetCode() {

            require([], function () {

                var ExpenseWidget = {

                    onLoadWidget: function () {

                        widget.body.innerHTML =
                            "<div style='padding:20px;font-family:Arial'>" +
                                "<h2>Expense Document Generator</h2>" +
                                "<p>My first real 3DEXPERIENCE Widget is running!</p>" +
                                "<button id='testButton'>Test Widget</button>" +
                            "</div>";

                        document
                            .getElementById("testButton")
                            .addEventListener("click", function () {

                                alert("Expense Widget works!");

                            });
                    }
                };

                widget.addEvent(
                    "onLoad",
                    ExpenseWidget.onLoadWidget
                );

            });
        }


        function widgetLoading() {

            if (typeof widget !== "undefined" && widget) {

                executeWidgetCode();

            } else {

                console.warn("Deferred widget loading");

                setTimeout(
                    widgetLoading,
                    100
                );
            }
        }


        widgetLoading();

    </script>

</head>


<body>

    <p>Loading Expense Document Generator...</p>

</body>

</html>
