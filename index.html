<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:widget="http://www.netvibes.com/ns/">
<head>
  <title>Expense Document Generator</title>
  <meta name="apiVersion" content="1.3" />
  <meta name="debugMode" content="true" />
  <meta name="strictMode" content="false" />
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font:14px Arial,sans-serif; color:#263238; background:#f4f6f8; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .app { padding:18px; max-width:1500px; margin:auto; }
    .topbar,.card-head,.preview-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    h2,h3 { margin:0; } .muted { color:#68757d; } .small { font-size:12px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .btn { border:1px solid #c4ccd1; background:#fff; border-radius:4px; padding:9px 14px; }
    .btn.primary { color:#fff; border-color:#1686c5; background:#168ed1; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .defaults,.register,.review,.pdf-preview { margin-top:16px; background:#fff; border:1px solid #d9e0e4; border-radius:6px; padding:15px; }
    .defaults-grid { display:grid; grid-template-columns:1fr 1fr auto; gap:12px; align-items:end; }
    label { display:block; font-weight:bold; font-size:12px; margin-bottom:5px; }
    input,select { width:100%; min-height:36px; border:1px solid #bbc5ca; border-radius:4px; padding:7px 9px; }
    .summary { display:flex; gap:8px; margin:13px 0; flex-wrap:wrap; }
    .pill { border-radius:12px; padding:5px 10px; background:#edf2f5; font-size:12px; }
    .table-wrap { overflow:auto; max-height:410px; border:1px solid #e0e5e8; }
    table { width:100%; border-collapse:collapse; min-width:1120px; }
    th,td { border-bottom:1px solid #e2e7ea; padding:9px; text-align:left; vertical-align:middle; }
    th { position:sticky; top:0; z-index:2; background:#eef3f6; font-size:12px; }
    tr:hover td { background:#fafcfd; }
    .status { font-weight:bold; white-space:nowrap; }
    .ready { color:#14833b; } .review-status { color:#b36b00; } .error { color:#b42318; } .processing { color:#1676ad; }
    .confidence { width:70px; height:7px; background:#e5eaed; border-radius:6px; overflow:hidden; }
    .confidence span { display:block; height:100%; background:#23a55a; }
    .row-actions { white-space:nowrap; } .row-actions button { margin-right:4px; }
    .review { display:none; }
    .review-grid { display:grid; grid-template-columns:minmax(300px,1fr) minmax(320px,1fr); gap:16px; margin-top:14px; }
    .document-preview { height:520px; overflow:auto; border:1px solid #d9e0e4; background:#eef1f3; padding:12px; }
    .document-preview img,.document-preview iframe { width:100%; min-height:480px; object-fit:contain; border:0; background:#fff; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field-note { font-size:11px; color:#7b878d; margin-top:3px; min-height:13px; }
    .json-box { margin-top:12px; max-height:190px; overflow:auto; white-space:pre-wrap; background:#17242d; color:#d8f3dc; padding:12px; border-radius:4px; font:12px Consolas,monospace; }
    .pdf-preview { display:none; padding:0; overflow:hidden; }
    .preview-head { padding:14px 16px; border-bottom:1px solid #d9e0e4; }
    .preview-shell { display:grid; grid-template-columns:180px minmax(0,1fr); height:72vh; min-height:480px; }
    .preview-sidebar { overflow-y:auto; padding:12px; border-right:1px solid #cfd8dc; background:#f8fafb; }
    .page-link { display:block; width:100%; margin-bottom:8px; padding:8px; text-align:left; border:1px solid #ccd5da; background:#fff; border-radius:4px; }
    .preview-scroll { overflow-y:scroll; overflow-x:auto; scroll-behavior:smooth; padding:24px; background:#dfe4e7; }
    .pdf-page { position:relative; width:794px; min-height:1123px; margin:0 auto 24px; padding:60px 45px 45px; background:#fff; box-shadow:0 2px 8px #0003; }
    .pdf-label { position:absolute; top:16px; left:18px; padding:4px 10px; border:2px solid #222; font-size:22px; font-weight:bold; }
    .pdf-doc { height:950px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .pdf-doc img,.pdf-doc iframe { max-width:100%; width:100%; max-height:100%; height:100%; object-fit:contain; border:0; }
    .pdf-footer { position:absolute; bottom:16px; left:45px; right:45px; display:flex; justify-content:space-between; color:#65737b; font-size:11px; }
    .empty { padding:24px; text-align:center; color:#77848b; }
    @media(max-width:850px){.defaults-grid,.review-grid{grid-template-columns:1fr}.preview-shell{grid-template-columns:120px minmax(0,1fr)}.form-grid{grid-template-columns:1fr}}
  </style>
  <script type="text/javascript">
  widget.addEvent("onLoad", function () {
    var CONFIG = { mode:"proxy", proxyUrl:"http://localhost:3000/api/receipts/extract" };
    var receipts=[], nextNumber=1, activeIndex=-1, objectUrls=[], db=null;
    widget.body.innerHTML =
      '<div class="app"><div class="topbar"><div><h2>Expense Document Generator</h2><div class="muted">Batch receipt extraction and review</div></div><div class="actions"><button id="excelBtn" class="btn">Generate Excel</button><button id="pdfBtn" class="btn">PDF Layout Preview</button><button id="addBtn" class="btn primary">Add Receipts</button></div></div>'+
      '<input id="files" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" style="display:none" />'+
      '<section class="defaults"><div class="defaults-grid"><div><label>Default Customer / Activity</label><input id="defaultActivity" placeholder="e.g. Customer workshop" /></div><div><label>Default Place</label><input id="defaultPlace" placeholder="Applied only when AI finds no place" /></div><button id="reprocessBtn" class="btn">Process Pending</button></div><div class="small muted" style="margin-top:9px">AI mode: <b id="modeLabel"></b>. Customer / Activity is never invented from the receipt.</div></section>'+
      '<section class="register"><div class="card-head"><h3>Receipt Processing Queue</h3><span class="small muted" id="progressText">0 receipts</span></div><div class="summary" id="summary"></div><div class="table-wrap"><div id="list"></div></div></section>'+
      '<section class="review" id="review"><div class="card-head"><h3 id="reviewTitle">Review Receipt</h3><button id="closeReview" class="btn">Close</button></div><div class="review-grid"><div><div id="docPreview" class="document-preview"></div></div><div><div class="form-grid">'+
      field("date","Date","date")+field("merchant","Merchant","text")+field("place","Place","text")+selectField()+field("amount","Amount","number")+field("currency","Currency","text")+field("activity","Customer / Activity","text")+qualityField()+
      '</div><div class="actions" style="margin-top:14px"><button id="saveReview" class="btn primary">Save Review</button><button id="retryAi" class="btn">Retry AI</button></div><pre id="jsonBox" class="json-box"></pre></div></div></section>'+
      '<section class="pdf-preview" id="pdfPreview"><div class="preview-head"><div><h3>Combined Receipt PDF Preview</h3><div class="small muted">Use the page sidebar or the vertical scrollbar.</div></div><button id="closePdf" class="btn">Close Preview</button></div><div class="preview-shell"><aside id="pageNav" class="preview-sidebar"></aside><main id="pageScroll" class="preview-scroll"></main></div></section></div>';

    function field(id,label,type){return '<div><label>'+label+'</label><input id="f_'+id+'" type="'+type+'" '+(id==='amount'?'step="0.01" min="0"':'')+' /><div id="n_'+id+'" class="field-note"></div></div>';}
    function selectField(){return '<div><label>Expense Type</label><select id="f_expenseType"><option value="">Unknown</option>'+["Fuel","Toll","Parking","Hotel","Meals","Repr. Expenses","Transports","Others"].map(function(x){return '<option>'+x+'</option>';}).join('')+'</select><div id="n_expenseType" class="field-note"></div></div>';}
    function qualityField(){return '<div><label>Image Quality</label><input id="f_quality" disabled /><div id="n_quality" class="field-note"></div></div>';}
    function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}
    function newUrl(file){var u=URL.createObjectURL(file);objectUrls.push(u);return u;}
    function openDatabase(){return new Promise(function(resolve,reject){var request=indexedDB.open('ExpenseDocumentGeneratorDB',1);request.onupgradeneeded=function(){var database=request.result;if(!database.objectStoreNames.contains('receipts'))database.createObjectStore('receipts',{keyPath:'number'});if(!database.objectStoreNames.contains('meta'))database.createObjectStore('meta',{keyPath:'key'});};request.onsuccess=function(){db=request.result;resolve(db);};request.onerror=function(){reject(request.error);};});}
    function transactionPromise(storeName,mode,operation){return new Promise(function(resolve,reject){if(!db){reject(new Error('Database is not ready'));return;}var tx=db.transaction(storeName,mode),store=tx.objectStore(storeName);operation(store);tx.oncomplete=function(){resolve();};tx.onerror=function(){reject(tx.error);};});}
    function persistReceipt(r){return transactionPromise('receipts','readwrite',function(store){store.put({number:r.number,file:r.file,status:r.status,data:r.data,error:r.error});});}
    function removePersistedReceipt(number){return transactionPromise('receipts','readwrite',function(store){store.delete(number);});}
    function persistNextNumber(){return transactionPromise('meta','readwrite',function(store){store.put({key:'nextNumber',value:nextNumber});});}
    function loadPersistedState(){return new Promise(function(resolve,reject){var tx=db.transaction(['receipts','meta'],'readonly'),receiptRequest=tx.objectStore('receipts').getAll(),metaRequest=tx.objectStore('meta').get('nextNumber');tx.oncomplete=function(){receipts=(receiptRequest.result||[]).sort(function(a,b){return a.number-b.number;}).map(function(r){r.url=newUrl(r.file);if(r.status==='processing')r.status='pending';return r;});var highest=receipts.reduce(function(max,r){return Math.max(max,r.number);},0);nextNumber=Math.max((metaRequest.result&&metaRequest.result.value)||1,highest+1);resolve();};tx.onerror=function(){reject(tx.error);};});}
    function statusLabel(r){var map={pending:'Pending',processing:'Processing…',ready:'Ready',review:'Review',error:'Error'};return map[r.status]||r.status;}
    function render(){
      var counts={pending:0,processing:0,ready:0,review:0,error:0}; receipts.forEach(function(r){counts[r.status]++;});
      document.getElementById('modeLabel').textContent=CONFIG.mode==='mock'?'Mock JSON (no backend)':'AI proxy';
      document.getElementById('progressText').textContent=receipts.length+' receipt'+(receipts.length===1?'':'s');
      document.getElementById('summary').innerHTML=['pending','processing','ready','review','error'].map(function(k){return '<span class="pill">'+statusLabel({status:k})+': '+counts[k]+'</span>';}).join('');
      if(!receipts.length){document.getElementById('list').innerHTML='<div class="empty">Select JPG, PNG or PDF receipts to begin.</div>';return;}
      var h='<table><thead><tr><th>Receipt</th><th>Document</th><th>Status</th><th>Date</th><th>Merchant</th><th>Type</th><th>Amount</th><th>Confidence</th><th>Quality</th><th>Actions</th></tr></thead><tbody>';
      receipts.forEach(function(r,i){var d=r.data||{}, pct=Math.round((d.overallConfidence||0)*100);h+='<tr><td><b>['+r.number+']</b></td><td>'+esc(r.file.name)+'</td><td class="status '+(r.status==='review'?'review-status':r.status)+'">'+esc(statusLabel(r))+'</td><td>'+esc(d.date)+'</td><td>'+esc(d.merchant)+'</td><td>'+esc(d.expenseType)+'</td><td>'+((d.amount==null)?'':Number(d.amount).toFixed(2)+' '+esc(d.currency))+'</td><td><div>'+pct+'%</div><div class="confidence"><span style="width:'+pct+'%"></span></div></td><td>'+esc(d.imageQuality||'')+'</td><td class="row-actions"><button class="btn" data-a="view" data-i="'+i+'">Review</button><button class="btn" data-a="retry" data-i="'+i+'">AI</button><button class="btn" data-a="delete" data-i="'+i+'">Delete</button></td></tr>';});
      document.getElementById('list').innerHTML=h+'</tbody></table>';
    }
    function addFiles(files){var added=[];Array.prototype.forEach.call(files,function(file){if(!/^(application\/pdf|image\/(jpeg|png))$/.test(file.type)){return;}var r={number:nextNumber++,file:file,url:newUrl(file),status:'pending',data:null,error:null};receipts.push(r);added.push(persistReceipt(r));});added.push(persistNextNumber());Promise.all(added).then(function(){render();processPending();}).catch(function(e){alert('Receipt could not be saved locally: '+e.message);render();});}
    function processPending(){var chain=Promise.resolve();receipts.forEach(function(r){if(r.status==='pending'){chain=chain.then(function(){return extract(r);});}});return chain;}
    function extract(r){r.status='processing';r.error=null;render();persistReceipt(r).catch(function(){});return (CONFIG.mode==='mock'?mockExtract(r):proxyExtract(r)).then(function(data){r.data=normalize(data);r.status=needsReview(r.data)?'review':'ready';return persistReceipt(r).then(render);}).catch(function(e){r.status='error';r.error=e.message;persistReceipt(r).then(render).catch(render);});}
    function mockExtract(r){return new Promise(function(resolve){setTimeout(function(){var n=r.number;resolve({date:null,merchant:null,place:document.getElementById('defaultPlace').value.trim()||null,expenseType:null,amount:null,currency:'TRY',imageQuality:'unknown',qualityIssues:['Mock mode: connect proxy for real extraction'],readable:true,overallConfidence:0,confidence:{date:0,merchant:0,place:0,expenseType:0,amount:0,currency:.5}});},450);});}
    function proxyExtract(r){var fd=new FormData();fd.append('receipt',r.file,r.file.name);fd.append('receiptNumber',String(r.number));return fetch(CONFIG.proxyUrl,{method:'POST',body:fd,credentials:'omit'}).then(function(res){return res.json().then(function(body){if(!res.ok)throw new Error(body.error||('HTTP '+res.status));return body;});});}
    function normalize(d){d=d||{};d.date=d.date||null;d.merchant=d.merchant||null;d.place=d.place||document.getElementById('defaultPlace').value.trim()||null;d.expenseType=d.expenseType||null;d.amount=d.amount==null?null:Number(d.amount);d.currency=d.currency||null;d.imageQuality=d.imageQuality||'unknown';d.qualityIssues=Array.isArray(d.qualityIssues)?d.qualityIssues:[];d.readable=Boolean(d.readable);d.overallConfidence=Number(d.overallConfidence||0);d.confidence=d.confidence||{};d.customerActivity=document.getElementById('defaultActivity').value.trim()||null;return d;}
    function needsReview(d){return !d.readable||d.overallConfidence<.85||!d.date||!d.expenseType||d.amount==null||!d.currency;}
    function openReview(i){activeIndex=i;var r=receipts[i],d=r.data||normalize({});document.getElementById('reviewTitle').textContent='Review Receipt ['+r.number+']';document.getElementById('docPreview').innerHTML=r.file.type==='application/pdf'?'<iframe src="'+r.url+'"></iframe>':'<img src="'+r.url+'" alt="Receipt" />';['date','merchant','place','expenseType','amount','currency'].forEach(function(k){document.getElementById('f_'+k).value=d[k]==null?'':d[k];var c=d.confidence&&d.confidence[k];document.getElementById('n_'+k).textContent=c==null?'':Math.round(c*100)+'% AI confidence';});document.getElementById('f_activity').value=d.customerActivity||'';document.getElementById('n_activity').textContent='User/context supplied; AI does not infer this.';document.getElementById('f_quality').value=d.imageQuality||'unknown';document.getElementById('n_quality').textContent=(d.qualityIssues||[]).join(' · ');document.getElementById('jsonBox').textContent=JSON.stringify(d,null,2);document.getElementById('review').style.display='block';document.getElementById('review').scrollIntoView({behavior:'smooth'});}
    function saveReview(){if(activeIndex<0)return;var r=receipts[activeIndex],d=r.data||{};['date','merchant','place','expenseType','currency'].forEach(function(k){d[k]=document.getElementById('f_'+k).value.trim()||null;});var a=document.getElementById('f_amount').value;d.amount=a===''?null:Number(a);d.customerActivity=document.getElementById('f_activity').value.trim()||null;r.data=d;r.status=needsReview(d)?'review':'ready';persistReceipt(r).then(function(){render();openReview(activeIndex);}).catch(function(e){alert('Review could not be saved: '+e.message);});}
    function renderPdf(){if(!receipts.length){alert('Please add at least one receipt.');return;}var nav='',pages='';receipts.slice().sort(function(a,b){return a.number-b.number;}).forEach(function(r,i){var d=r.data||{};nav+='<button class="page-link" data-page="page_'+r.number+'">Page '+(i+1)+' · ['+r.number+']</button>';pages+='<article class="pdf-page" id="page_'+r.number+'"><div class="pdf-label">['+r.number+']</div><div class="pdf-doc">'+(r.file.type==='application/pdf'?'<iframe src="'+r.url+'"></iframe>':'<img src="'+r.url+'" />')+'</div><div class="pdf-footer"><span>'+esc(r.file.name)+'</span><span>'+esc(d.date||'Review required')+' | '+(d.amount==null?'—':Number(d.amount).toFixed(2)+' '+esc(d.currency||''))+'</span></div></article>';});document.getElementById('pageNav').innerHTML=nav;document.getElementById('pageScroll').innerHTML=pages;document.getElementById('pdfPreview').style.display='block';document.getElementById('pdfPreview').scrollIntoView({behavior:'smooth'});}
    function generateExcel(){var invalid=receipts.filter(function(r){return r.status!=='ready';});if(!receipts.length){alert('Please add at least one receipt.');return;}if(invalid.length){alert('Resolve every Pending, Review or Error receipt before generating Excel.');return;}var payload={expenses:receipts.map(function(r){var d=r.data||{};return {receiptNumber:r.number,date:d.date,customerActivity:d.customerActivity,place:d.place,expenseType:d.expenseType,amount:d.amount,currency:d.currency};})};var button=document.getElementById('excelBtn');button.disabled=true;button.textContent='Generating…';fetch(CONFIG.proxyUrl.replace('/api/receipts/extract','/api/reports/excel'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),credentials:'omit'}).then(function(response){if(!response.ok)return response.json().then(function(body){throw new Error(body.error||('HTTP '+response.status));});var disposition=response.headers.get('Content-Disposition')||'',match=disposition.match(/filename="?([^";]+)"?/i),name=match?match[1]:'Expense_Report.xlsx';return response.blob().then(function(blob){var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);});}).catch(function(e){alert('Excel generation failed: '+e.message);}).finally(function(){button.disabled=false;button.textContent='Generate Excel';});}
    document.getElementById('addBtn').onclick=function(){document.getElementById('files').click();};document.getElementById('files').onchange=function(e){addFiles(e.target.files);e.target.value='';};document.getElementById('reprocessBtn').onclick=processPending;document.getElementById('excelBtn').onclick=generateExcel;document.getElementById('pdfBtn').onclick=renderPdf;document.getElementById('closePdf').onclick=function(){document.getElementById('pdfPreview').style.display='none';};document.getElementById('closeReview').onclick=function(){document.getElementById('review').style.display='none';};document.getElementById('saveReview').onclick=saveReview;document.getElementById('retryAi').onclick=function(){if(activeIndex>=0){document.getElementById('review').style.display='none';extract(receipts[activeIndex]);}};
    document.getElementById('list').onclick=function(e){var b=e.target.closest('button[data-a]');if(!b)return;var i=Number(b.dataset.i),a=b.dataset.a;if(a==='view')openReview(i);if(a==='retry')extract(receipts[i]);if(a==='delete'){var removed=receipts.splice(i,1)[0];removePersistedReceipt(removed.number).then(render).catch(function(e){alert('Receipt could not be deleted locally: '+e.message);});}};
    document.getElementById('pageNav').onclick=function(e){var b=e.target.closest('[data-page]');if(!b)return;var p=document.getElementById(b.dataset.page);if(p)p.scrollIntoView({behavior:'smooth',block:'start'});};
    render();openDatabase().then(loadPersistedState).then(render).catch(function(e){alert('Local persistence is unavailable: '+e.message);render();});
  });
  </script>
</head><body></body></html>
