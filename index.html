<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:widget="http://www.netvibes.com/ns/">

<head>

    <title>Expense Document Generator</title>

    <meta name="author" content="Doğuşcan Bıyıklı" />
    <meta name="description"
          content="Expense Document Generator for 3DEXPERIENCE" />

    <meta name="apiVersion" content="1.3" />
    <meta name="debugMode" content="true" />
    <meta name="strictMode" content="false" />

    <style>

        .expense-app {
            padding: 24px;
            font-family: Arial, sans-serif;
        }

        .expense-app h2 {
            margin: 0 0 8px 0;
        }

        .expense-app p {
            color: #666;
            margin-bottom: 20px;
        }

        .expense-app button {
            padding: 10px 18px;
            cursor: pointer;
        }

    </style>

    <script type="text/javascript">

        widget.addEvent("onLoad", function () {

            console.log("Expense Widget onLoad triggered.");

            widget.body.innerHTML =
                '<div class="expense-app">' +
                    '<h2>Expense Document Generator</h2>' +
                    '<p>Manage your expense documents.</p>' +
                    '<button id="addExpenseBtn">Add Expense</button>' +
                '</div>';

            document
                .getElementById("addExpenseBtn")
                .addEventListener("click", function () {

                    alert("Add Expense clicked");

                });

        });

    </script>

</head>

<body>
</body>

</html>
